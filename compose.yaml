services:
  gramota:
    build: .
    restart: unless-stopped
    ports:
      - "${GRAMOTA_PORT:-3000}:3000"
    env_file:
      - .env
    volumes:
      - gramota-data:/app/apps/server/data
    networks:
      - proxy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  gramota-data:

networks:
  proxy:
    external: true
    name: nginx-proxy-manager_default
