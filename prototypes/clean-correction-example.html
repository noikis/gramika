<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Gramota: readable corrections prototype</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; padding: 16px; }
    .cursor-interaction { cursor: pointer; }
    button:disabled { cursor: default; }
  </style>
</head>
<body>
<div id="gramota-clean-example">
  <div class="gc-app">
    <div class="gc-heading">Original</div>
    <p class="gc-box">Превет! Мы встретимся в суботу , если получиться.</p>
    <div class="gc-heading"><span>Gemma 4 26B A4B</span><span class="gc-view">Changes</span></div>
    <p class="gc-box gc-result"><button type="button" class="gc-change cursor-interaction" data-key="greeting">Привет</button>! Мы встретимся в <button type="button" class="gc-change cursor-interaction" data-key="day">субботу,</button> если <button type="button" class="gc-change cursor-interaction" data-key="verb">получится</button>.</p>
    <div class="gc-inspect" aria-live="polite">
      <div class="gc-heading"><span>Selected correction</span><span class="gc-counter">1 of 3</span></div>
      <div class="gc-comparison"><div><span class="gc-label">Original</span><div class="gc-before">Превет</div></div><div><span class="gc-label">Corrected</span><div class="gc-after">Привет</div></div></div>
      <div class="gc-navigation"><button type="button" class="gc-nav cursor-interaction" data-direction="previous">← Previous</button><button type="button" class="gc-nav cursor-interaction" data-direction="next">Next →</button></div>
    </div>
    <div class="gc-actions"><button type="button" class="gc-copy cursor-interaction">Copy text</button><span class="gc-copy-status" role="status"></span></div>
  </div>
</div>
<style>
  #gramota-clean-example {padding:16px 8px;}
  #gramota-clean-example .gc-app {--gc-bg:light-dark(#f6f9fa,#0c151b);--gc-surface:light-dark(#ffffff,#121e25);--gc-fg:light-dark(#1b2930,#e4edf2);--gc-muted:light-dark(#50636f,#b6c7d1);--gc-border:light-dark(#c5d3da,#2c404c);--gc-mark:light-dark(#d6f3e4,#234a3c);--gc-mark-fg:light-dark(#185736,#b7f2d1);--gc-accent:light-dark(#00834b,#00cc79);--gc-copy-fg:light-dark(#ffffff,#082016);background:var(--gc-bg);color:var(--gc-fg);font:400 16px/1.85 Arial,sans-serif;border:1px solid var(--gc-border);border-radius:10px;padding:22px;max-width:920px;margin:auto;}
  #gramota-clean-example .gc-heading {display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-weight:500;}
  #gramota-clean-example .gc-view {font-size:13px;color:var(--gc-muted);}
  #gramota-clean-example .gc-box {margin:8px 0 20px;background:var(--gc-surface);border:1px solid var(--gc-border);border-radius:8px;padding:14px 16px;overflow-wrap:anywhere;}
  #gramota-clean-example .gc-change {font:inherit;display:inline;vertical-align:baseline;background:var(--gc-mark);color:var(--gc-mark-fg);border:0;border-radius:2px;padding:0;margin:0;box-shadow:inset 0 -1px 0 var(--gc-mark-fg);}
  #gramota-clean-example .gc-change[aria-pressed="true"] {box-shadow:inset 0 0 0 2px var(--gc-mark-fg);}
  #gramota-clean-example .gc-inspect {background:var(--gc-surface);border:1px solid var(--gc-border);border-radius:8px;padding:14px 16px;}
  #gramota-clean-example .gc-comparison {display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px;}
  #gramota-clean-example .gc-label {font-size:13px;color:var(--gc-muted);}
  #gramota-clean-example .gc-before {white-space:pre-wrap;overflow-wrap:anywhere;}
  #gramota-clean-example .gc-after {white-space:pre-wrap;overflow-wrap:anywhere;}
  #gramota-clean-example .gc-counter {font-size:13px;color:var(--gc-muted);}
  #gramota-clean-example .gc-navigation {display:flex;justify-content:space-between;gap:12px;margin-top:16px;}
  #gramota-clean-example .gc-nav {font:inherit;background:var(--gc-bg);color:var(--gc-fg);border:1px solid var(--gc-border);border-radius:6px;padding:8px 14px;min-height:44px;}
  #gramota-clean-example .gc-nav:disabled {opacity:0.45;}
  #gramota-clean-example .gc-actions {display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end;margin-top:14px;}
  #gramota-clean-example .gc-copy {font:inherit;border:0;border-radius:6px;padding:8px 14px;background:var(--gc-accent);color:var(--gc-copy-fg);}
  #gramota-clean-example .gc-copy-status {font-size:13px;color:var(--gc-muted);}
  @media(max-width:440px) {#gramota-clean-example .gc-app{padding:14px;}#gramota-clean-example .gc-box{padding:12px;}#gramota-clean-example .gc-comparison{grid-template-columns:1fr;gap:8px;}}
</style>
<script>
(() => {
  const root = document.getElementById('gramota-clean-example');
  const corrections = {
    greeting: ['Превет','Привет'],
    day: ['суботу ,','субботу,'],
    verb: ['получиться','получится']
  };
  const clean = 'Привет! Мы встретимся в субботу, если получится.';
  const keys = Object.keys(corrections);
  let selectedKey = 'greeting';
  function select(key) {
    if (!corrections[key]) return;
    selectedKey = key;
    const index = keys.indexOf(key);
    root.querySelector('.gc-before').textContent = corrections[key][0];
    root.querySelector('.gc-after').textContent = corrections[key][1];
    root.querySelector('.gc-counter').textContent = `${index + 1} of ${keys.length}`;
    root.querySelector('[data-direction="previous"]').disabled = index === 0;
    root.querySelector('[data-direction="next"]').disabled = index === keys.length - 1;
    root.querySelectorAll('[data-key]').forEach(button => button.setAttribute('aria-pressed',String(button.dataset.key === key)));
  }
  select(window.openai?.widgetState?.modelContent?.selectedCorrection || 'greeting');
  root.querySelectorAll('[data-key]').forEach(button => button.addEventListener('click', () => {
    select(button.dataset.key);
    window.openai?.setWidgetState({modelContent:{selectedCorrection:button.dataset.key}})?.catch(() => {});
  }));
  root.querySelectorAll('[data-direction]').forEach(button => button.addEventListener('click', () => {
    const offset = button.dataset.direction === 'next' ? 1 : -1;
    const key = keys[keys.indexOf(selectedKey) + offset];
    if (!key) return;
    select(key);
    window.openai?.setWidgetState({modelContent:{selectedCorrection:key}})?.catch(() => {});
  }));
  window.addEventListener('openai:set_globals', event => {
    const key = event.detail?.globals?.widgetState?.modelContent?.selectedCorrection;
    if(key) select(key);
  });
  root.querySelector('.gc-copy').addEventListener('click', async () => {
    const status = root.querySelector('.gc-copy-status');
    try {await navigator.clipboard.writeText(clean);status.textContent='Copied';}
    catch {status.textContent='Clipboard unavailable in preview';}
  });
})();
</script>
</body>
</html>
